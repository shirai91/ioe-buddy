<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Word Buddies – Picture Pick</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#1D2B53}
a{color:#1D2B53}a:hover{color:#3A4C80}
a:focus-visible,button:focus-visible{outline:4px solid #6A45E8;outline-offset:3px}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF4CC; display: flex; flex-direction: column; gap: 16px; padding: 24px 22px 28px; font-family: 'Nunito', system-ui, sans-serif; color: #1D2B53; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Practice.dc.html" aria-label="Back to practice" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%; background: #FFFFFF; border: 4px solid #1D2B53; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="#1D2B53" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"></path></svg>
    </a>
    <h1 style="margin: 0; flex-grow: 1; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 30px; line-height: 1">Picture Pick</h1>
    <div style="display: flex; align-items: center; gap: 6px; padding: 8px 14px; background: #FFFFFF; border: 3px solid #1D2B53; border-radius: 999px; font-weight: 800; font-size: 19px">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2 L14.9 8.6 L22 9.2 L16.6 13.8 L18.2 21 L12 17.2 L5.8 21 L7.4 13.8 L2 9.2 L9.1 8.6 Z" fill="#FFCE3A" stroke="#1D2B53" stroke-width="2" stroke-linejoin="round"></path></svg>
      <span>{{ stars }}</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px" aria-label="{{ progressLabel }}">
    <sc-for list="{{ segs }}" as="s" hint-placeholder-count="10">
      <span style="height: 16px; border-radius: 999px; border: 3px solid #1D2B53; background: {{ s.bg }}"></span>
    </sc-for>
  </div>

  <sc-if value="{{ playing }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; align-items: center; gap: 14px; background: #FFFFFF; border: 4px solid #1D2B53; border-radius: 26px; padding: 14px 16px 14px 20px">
      <div style="display: flex; flex-direction: column; flex-grow: 1">
        <span style="font-size: 17px; font-weight: 800">Find the…</span>
        <span style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 42px; line-height: 1; color: #6A45E8">{{ q.answer }}</span>
      </div>
      <button type="button" onClick="{{ listen }}" aria-label="Listen to the word" style="width: 60px; height: 60px; flex-shrink: 0; border-radius: 50%; background: #6A45E8; border: 4px solid #1D2B53; box-shadow: 0 5px 0 #1D2B53; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" fill="#FFFFFF"></path><path d="M16.5 8.5 C18 10 18 14 16.5 15.5"></path><path d="M19 6 C22 9 22 15 19 18"></path></svg>
      </button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
      <sc-for list="{{ choices }}" as="c" hint-placeholder-count="4">
        <button type="button" onClick="{{ c.pick }}" aria-label="{{ c.label }}" style="height: 150px; display: flex; align-items: center; justify-content: center; position: relative; background: {{ c.bg }}; border: 5px solid {{ c.border }}; border-radius: 28px; box-shadow: 0 6px 0 {{ c.border }}; cursor: pointer; padding: 0">
          <dc-import name="Pic" kind="{{ c.k }}" size="110" hint-size="110px,110px"></dc-import>
          <sc-if value="{{ c.right }}" hint-placeholder-val="{{ false }}">
            <span class="pop" aria-hidden="true" style="position: absolute; top: -12px; right: -12px; width: 44px; height: 44px; border-radius: 50%; background: #2F9E44; border: 4px solid #1D2B53; display: flex; align-items: center; justify-content: center">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 L10 17 L19 7"></path></svg>
            </span>
          </sc-if>
          <sc-if value="{{ c.wrong }}" hint-placeholder-val="{{ false }}">
            <span class="pop" aria-hidden="true" style="position: absolute; top: -12px; right: -12px; width: 44px; height: 44px; border-radius: 50%; background: #E03131; border: 4px solid #1D2B53; display: flex; align-items: center; justify-content: center">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"></path></svg>
            </span>
          </sc-if>
        </button>
      </sc-for>
    </div>

    <div role="status" style="display: flex; align-items: center; justify-content: center; min-height: 58px; padding: 10px 16px; border-radius: 22px; background: {{ fbBg }}; border: 4px solid #1D2B53; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 24px; text-align: center">{{ feedback }}</div>

    <div style="flex-grow: 1"></div>

    <button type="button" onClick="{{ next }}" disabled="{{ locked }}" style="height: 70px; border-radius: 999px; background: {{ nextBg }}; border: 4px solid #1D2B53; box-shadow: 0 6px 0 #1D2B53; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; color: #1D2B53; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 26px; opacity: {{ nextOpacity }}">
      {{ nextLabel }}
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" fill="none" stroke="#1D2B53" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 H19 M13 6 L19 12 L13 18"></path></svg>
    </button>
  </sc-if>

  <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
    <div class="pop" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #FFFFFF; border: 5px solid #1D2B53; border-radius: 36px; box-shadow: 0 9px 0 #1D2B53; padding: 28px 22px; text-align: center">
      <svg viewBox="0 0 200 200" width="150" height="150" aria-hidden="true"><path d="M100 14 L124 70 L184 74 L138 112 L152 172 L100 140 L48 172 L62 112 L16 74 L76 70 Z" fill="#FFCE3A" stroke="#1D2B53" stroke-width="7" stroke-linejoin="round"></path><circle cx="84" cy="96" r="8" fill="#1D2B53"></circle><circle cx="116" cy="96" r="8" fill="#1D2B53"></circle><path d="M82 112 Q100 136 118 112" fill="#FF7A6B" stroke="#1D2B53" stroke-width="6" stroke-linejoin="round"></path></svg>
      <h2 style="margin: 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 46px; line-height: 1">You did it!</h2>
      <p style="margin: 0; font-size: 22px; font-weight: 800">You got {{ stars }} of {{ total }} stars</p>
      <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 4px" aria-hidden="true">
        <sc-for list="{{ starRow }}" as="s" hint-placeholder-count="10">
          <svg viewBox="0 0 24 24" width="28" height="28"><path d="M12 2 L14.9 8.6 L22 9.2 L16.6 13.8 L18.2 21 L12 17.2 L5.8 21 L7.4 13.8 L2 9.2 L9.1 8.6 Z" fill="{{ s.fill }}" stroke="#1D2B53" stroke-width="2" stroke-linejoin="round"></path></svg>
        </sc-for>
      </div>
      <button type="button" onClick="{{ restart }}" style="width: 100%; height: 66px; margin-top: 8px; border-radius: 999px; background: #7ED957; border: 4px solid #1D2B53; box-shadow: 0 6px 0 #1D2B53; cursor: pointer; color: #1D2B53; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 24px">Play again</button>
      <a href="Practice.dc.html" style="width: 100%; box-sizing: border-box; height: 60px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #FFFFFF; border: 4px solid #1D2B53; text-decoration: none; color: #1D2B53; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 22px">More games</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.words = ['apple', 'cat', 'sun', 'fish', 'ball', 'tree'];
    this.total = 10;
    this.state = this.fresh();
  }
  shuffle(a) {
    const b = a.slice();
    for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = b[i]; b[i] = b[j]; b[j] = t; }
    return b;
  }
  // n words from the bank, reshuffled each pass, never the same word twice in a row.
  seq(n) {
    const out = [];
    while (out.length < n) {
      const b = this.shuffle(this.words);
      if (out.length && b[0] === out[out.length - 1]) b.push(b.shift());
      out.push.apply(out, b);
    }
    return out.slice(0, n);
  }
  // Questions are generated on every play: a random answer word plus 3 random wrong pictures.
  fresh() {
    const answers = this.seq(this.total);
    const questions = answers.map((answer) => {
      const others = this.shuffle(this.words.filter((w) => w !== answer)).slice(0, 3);
      return { answer, options: this.shuffle([answer].concat(others)) };
    });
    return { questions, q: 0, picked: null, solved: false, missed: false, stars: 0, done: false };
  }
  speak(text) {
    try {
      const s = window.speechSynthesis;
      if (!s) return;
      s.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.8;
      s.speak(u);
    } catch (e) {}
  }
  pick(k) {
    const st = this.state;
    if (st.solved) return;
    const q = st.questions[st.q];
    if (k === q.answer) {
      this.setState({ picked: k, solved: true, stars: st.stars + (st.missed ? 0 : 1) });
      this.speak('Great job! ' + k);
    } else {
      this.setState({ picked: k, missed: true });
      this.speak('Try again');
    }
  }
  renderVals() {
    const st = this.state;
    const total = this.total;
    const q = st.questions[Math.min(st.q, total - 1)];
    const choices = q.options.map((k) => {
      const right = st.solved && k === q.answer;
      const wrong = !right && st.picked === k;
      return {
        k, right, wrong,
        label: 'Picture of a ' + k,
        bg: right ? '#C9F2BE' : (wrong ? '#FFD9D4' : '#FFFFFF'),
        border: right ? '#2F9E44' : (wrong ? '#E03131' : '#1D2B53'),
        pick: () => this.pick(k)
      };
    });
    let feedback = 'Tap the right picture!';
    let fbBg = '#FFFFFF';
    if (st.solved) { feedback = 'Great job! That is the ' + q.answer + '.'; fbBg = '#7ED957'; }
    else if (st.picked) { feedback = 'Oops! Try again.'; fbBg = '#FFC48A'; }
    const last = st.q >= total - 1;
    return {
      q, choices, feedback, fbBg, total,
      stars: st.stars,
      playing: !st.done,
      done: st.done,
      locked: !st.solved,
      nextBg: st.solved ? '#FFCE3A' : '#FFFFFF',
      nextOpacity: st.solved ? 1 : 0.55,
      nextLabel: last ? 'Finish' : 'Next',
      progressLabel: 'Question ' + (st.q + 1) + ' of ' + total,
      segs: st.questions.map((_, j) => ({ bg: (st.done || j < st.q) ? '#2F9E44' : (j === st.q ? '#FFCE3A' : '#FFFFFF') })),
      starRow: st.questions.map((_, j) => ({ fill: j < st.stars ? '#FFCE3A' : '#E6E9F2' })),
      listen: () => this.speak('Find the ' + q.answer),
      next: () => {
        if (!st.solved) return;
        if (last) this.setState({ done: true });
        else this.setState({ q: st.q + 1, picked: null, solved: false, missed: false });
      },
      restart: () => this.setState(this.fresh())
    };
  }
}
</script>
</body>
</html>
