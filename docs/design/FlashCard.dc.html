<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Word Buddies – Flash Cards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#1D2B53}
a{color:#1D2B53}a:hover{color:#3A4C80}
a:focus-visible,button:focus-visible{outline:4px solid #6A45E8;outline-offset:3px}
@keyframes dealA{0%{transform:translateX(48px);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes dealB{0%{transform:translateX(48px);opacity:0}100%{transform:translateX(0);opacity:1}}
.dealA{animation:dealA .3s ease-out}.dealB{animation:dealB .3s ease-out}
@keyframes rise{0%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}
.rise{animation:rise .3s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFE9A8; display: flex; flex-direction: column; gap: 18px; padding: 24px 22px 28px; font-family: 'Nunito', system-ui, sans-serif; color: #1D2B53; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Home.dc.html" aria-label="Back to home" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%; background: #FFFFFF; border: 4px solid #1D2B53; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="#1D2B53" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"></path></svg>
    </a>
    <h1 style="margin: 0; flex-grow: 1; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 30px; line-height: 1">Flash Cards</h1>
    <span style="padding: 8px 14px; background: #FFFFFF; border: 3px solid #1D2B53; border-radius: 999px; font-weight: 800; font-size: 18px">{{ counter }}</span>
  </div>

  <div style="display: flex; justify-content: center; gap: 8px" aria-hidden="true">
    <sc-for list="{{ dots }}" as="d" hint-placeholder-count="6">
      <span style="width: {{ d.w }}; height: 14px; border-radius: 999px; border: 3px solid #1D2B53; background: {{ d.bg }}; box-sizing: border-box"></span>
    </sc-for>
  </div>

  <sc-if value="{{ studying }}" hint-placeholder-val="{{ true }}">
    <button type="button" onClick="{{ flip }}" aria-label="{{ cardLabel }}" class="{{ dealClass }}" style="position: relative; width: 346px; height: 480px; flex-shrink: 0; padding: 0; margin: 0; border: none; background: none; cursor: pointer; perspective: 1400px; font-family: inherit; color: #1D2B53">
      <div style="position: absolute; top: 0; left: 0; width: 346px; height: 480px; transform-style: preserve-3d; transition: {{ turnTransition }}; transform: {{ turn }}">

        <div aria-hidden="{{ frontHidden }}" style="position: absolute; top: 0; left: 0; width: 346px; height: 480px; box-sizing: border-box; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; background: {{ cardBg }}; border: 5px solid #1D2B53; border-radius: 36px; box-shadow: 0 9px 0 #1D2B53">
          <div style="width: 240px; height: 240px; background: #FFFFFF; border: 4px solid #1D2B53; border-radius: 50%; display: flex; align-items: center; justify-content: center">
            <div style="width: 176px; height: 176px">
              <sc-if value="{{ pic.apple }}" hint-placeholder-val="{{ true }}">
                <svg viewBox="0 0 120 120" width="176" height="176" aria-hidden="true"><path d="M60 38 C45 28 22 34 22 60 C22 86 42 104 60 98 C78 104 98 86 98 60 C98 34 75 28 60 38 Z" fill="#FF5A4E" stroke="#1D2B53" stroke-width="4" stroke-linejoin="round"></path><path d="M60 38 L62 20" stroke="#1D2B53" stroke-width="4" stroke-linecap="round" fill="none"></path><path d="M63 26 C70 14 84 14 88 18 C82 28 72 30 63 26 Z" fill="#7ED957" stroke="#1D2B53" stroke-width="4" stroke-linejoin="round"></path><ellipse cx="42" cy="56" rx="6" ry="10" fill="#FFFFFF" opacity="0.6"></ellipse></svg>
              </sc-if>
              <sc-if value="{{ pic.cat }}" hint-placeholder-val="{{ false }}">
                <svg viewBox="0 0 120 120" width="176" height="176" aria-hidden="true"><path d="M28 50 L32 20 L52 38 L68 38 L88 20 L92 50 C98 80 82 100 60 100 C38 100 22 80 28 50 Z" fill="#FFA94D" stroke="#1D2B53" stroke-width="4" stroke-linejoin="round"></path><circle cx="47" cy="62" r="5" fill="#1D2B53"></circle><circle cx="73" cy="62" r="5" fill="#1D2B53"></circle><path d="M55 73 L65 73 L60 79 Z" fill="#FF7A9C" stroke="#1D2B53" stroke-width="3" stroke-linejoin="round"></path><path d="M60 79 Q55 87 49 82 M60 79 Q65 87 71 82 M40 76 L18 72 M40 81 L18 86 M80 76 L102 72 M80 81 L102 86" fill="none" stroke="#1D2B53" stroke-width="3" stroke-linecap="round"></path></svg>
              </sc-if>
              <sc-if value="{{ pic.sun }}" hint-placeholder-val="{{ false }}">
                <svg viewBox="0 0 120 120" width="176" height="176" aria-hidden="true"><path d="M60 26 L60 12 M60 94 L60 108 M26 60 L12 60 M94 60 L108 60 M84 36 L94 26 M36 36 L26 26 M84 84 L94 94 M36 84 L26 94" stroke="#1D2B53" stroke-width="5" stroke-linecap="round"></path><circle cx="60" cy="60" r="25" fill="#FFCE3A" stroke="#1D2B53" stroke-width="4"></circle><circle cx="52" cy="56" r="3.5" fill="#1D2B53"></circle><circle cx="68" cy="56" r="3.5" fill="#1D2B53"></circle><path d="M50 66 Q60 76 70 66" fill="none" stroke="#1D2B53" stroke-width="3.5" stroke-linecap="round"></path></svg>
              </sc-if>
              <sc-if value="{{ pic.fish }}" hint-placeholder-val="{{ false }}">
                <svg viewBox="0 0 120 120" width="176" height="176" aria-hidden="true"><path d="M80 60 L106 40 L106 80 Z" fill="#4DABF7" stroke="#1D2B53" stroke-width="4" stroke-linejoin="round"></path><path d="M46 40 Q58 26 70 41" fill="#FFCE3A" stroke="#1D2B53" stroke-width="4" stroke-linejoin="round"></path><ellipse cx="54" cy="60" rx="32" ry="22" fill="#4DABF7" stroke="#1D2B53" stroke-width="4"></ellipse><circle cx="38" cy="55" r="6" fill="#FFFFFF" stroke="#1D2B53" stroke-width="3"></circle><circle cx="38" cy="55" r="2.5" fill="#1D2B53"></circle><path d="M28 67 Q33 72 38 67 M60 48 Q66 60 60 72" fill="none" stroke="#1D2B53" stroke-width="3" stroke-linecap="round"></path></svg>
              </sc-if>
              <sc-if value="{{ pic.ball }}" hint-placeholder-val="{{ false }}">
                <svg viewBox="0 0 120 120" width="176" height="176" aria-hidden="true"><circle cx="60" cy="60" r="38" fill="#FF7A6B" stroke="#1D2B53" stroke-width="4"></circle><path d="M60 22 Q38 60 60 98" fill="#FFCE3A" stroke="#1D2B53" stroke-width="4"></path><path d="M60 22 Q82 60 60 98" fill="#FFFFFF" stroke="#1D2B53" stroke-width="4"></path><path d="M60 22 Q38 60 60 98 Q82 60 60 22" fill="none" stroke="#1D2B53" stroke-width="4"></path></svg>
              </sc-if>
              <sc-if value="{{ pic.tree }}" hint-placeholder-val="{{ false }}">
                <svg viewBox="0 0 120 120" width="176" height="176" aria-hidden="true"><rect x="52" y="66" width="16" height="40" rx="3" fill="#B5651D" stroke="#1D2B53" stroke-width="4"></rect><path d="M36 76 C18 76 16 52 32 46 C30 26 52 18 62 28 C74 16 98 26 92 46 C106 54 100 78 84 76 Z" fill="#51CF66" stroke="#1D2B53" stroke-width="4" stroke-linejoin="round"></path><circle cx="46" cy="56" r="4" fill="#FF5A4E"></circle><circle cx="72" cy="44" r="4" fill="#FF5A4E"></circle><circle cx="80" cy="62" r="4" fill="#FF5A4E"></circle></svg>
              </sc-if>
            </div>
          </div>
          <span style="display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #FFFFFF; border-radius: 999px; font-weight: 800; font-size: 18px">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="#1D2B53" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 A8 8 0 0 1 18 7 M18 3 V7 H14"></path><path d="M20 12 A8 8 0 0 1 6 17 M6 21 V17 H10"></path></svg>
            Tap to see the word
          </span>
        </div>

        <div aria-hidden="{{ backHidden }}" style="position: absolute; top: 0; left: 0; width: 346px; height: 480px; box-sizing: border-box; backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: rotateY(180deg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; background: {{ cardBg }}; border: 5px solid #1D2B53; border-radius: 36px; box-shadow: 0 9px 0 #1D2B53">
          <span style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 56px; line-height: 1; background: #FFFFFF; border: 4px solid #1D2B53; border-radius: 26px; padding: 8px 24px 2px">{{ card.letter }}</span>
          <span style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 76px; line-height: 1">{{ card.word }}</span>
          <span style="font-size: 24px; font-weight: 800; text-align: center; line-height: 1.3; max-width: 270px">{{ card.sentence }}</span>
          <span style="display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #FFFFFF; border-radius: 999px; font-weight: 800; font-size: 18px">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="#1D2B53" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 A8 8 0 0 1 18 7 M18 3 V7 H14"></path><path d="M20 12 A8 8 0 0 1 6 17 M6 21 V17 H10"></path></svg>
            Tap to see the picture
          </span>
        </div>
      </div>
    </button>

    <div style="height: 170px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px">
      <sc-if value="{{ front }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; align-items: center; gap: 12px; height: 52px">
          <button type="button" onClick="{{ listen }}" aria-label="Listen to the word" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%; background: #6A45E8; border: 4px solid #1D2B53; box-shadow: 0 4px 0 #1D2B53; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" fill="#FFFFFF"></path><path d="M16.5 8.5 C18 10 18 14 16.5 15.5"></path><path d="M19 6 C22 9 22 15 19 18"></path></svg>
          </button>
          <span style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 23px; line-height: 1.1">What is it? Say it out loud!</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 14px; height: 100px">
          <button type="button" onClick="{{ prev }}" aria-label="Previous card" style="width: 76px; height: 76px; flex-shrink: 0; border-radius: 50%; background: #FFFFFF; border: 4px solid #1D2B53; box-shadow: 0 6px 0 #1D2B53; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true" fill="none" stroke="#1D2B53" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"></path></svg>
          </button>
          <button type="button" onClick="{{ flip }}" style="flex-grow: 1; height: 76px; border-radius: 999px; background: #FFFFFF; border: 4px solid #1D2B53; box-shadow: 0 6px 0 #1D2B53; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; color: #1D2B53; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 24px">
            <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" fill="none" stroke="#1D2B53" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 A8 8 0 0 1 18 7 M18 3 V7 H14"></path><path d="M20 12 A8 8 0 0 1 6 17 M6 21 V17 H10"></path></svg>
            Flip
          </button>
          <button type="button" onClick="{{ next }}" aria-label="Next card" style="width: 76px; height: 76px; flex-shrink: 0; border-radius: 50%; background: #7ED957; border: 4px solid #1D2B53; box-shadow: 0 6px 0 #1D2B53; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true" fill="none" stroke="#1D2B53" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5 L16 12 L9 19"></path></svg>
          </button>
        </div>
      </sc-if>

      <sc-if value="{{ back }}" hint-placeholder-val="{{ false }}">
        <div class="rise" style="display: flex; align-items: center; gap: 12px; height: 52px">
          <button type="button" onClick="{{ listen }}" aria-label="Listen to the word and sentence" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%; background: #6A45E8; border: 4px solid #1D2B53; box-shadow: 0 4px 0 #1D2B53; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" fill="#FFFFFF"></path><path d="M16.5 8.5 C18 10 18 14 16.5 15.5"></path><path d="M19 6 C22 9 22 15 19 18"></path></svg>
          </button>
          <span style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 23px; line-height: 1.1">Do you know this word?</span>
        </div>
        <div class="rise" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; height: 100px" role="group" aria-label="Rate this card">
          <button type="button" onClick="{{ rateEasy }}" style="height: 100px; padding: 6px 4px; border-radius: 24px; background: #7ED957; border: 4px solid #1D2B53; box-shadow: 0 6px 0 #1D2B53; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #1D2B53; font-family: 'Nunito', sans-serif">
            <svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true" fill="none" stroke="#1D2B53" stroke-width="3" stroke-linecap="round"><circle cx="20" cy="20" r="17" fill="#FFFFFF"></circle><circle cx="14" cy="16" r="2.2" fill="#1D2B53" stroke="none"></circle><circle cx="26" cy="16" r="2.2" fill="#1D2B53" stroke="none"></circle><path d="M12 23 Q20 32 28 23"></path></svg>
            <span style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 21px; line-height: 1">Easy</span>
            <span style="font-weight: 800; font-size: 13px; line-height: 1">I know it!</span>
          </button>
          <button type="button" onClick="{{ rateMedium }}" style="height: 100px; padding: 6px 4px; border-radius: 24px; background: #FFCE3A; border: 4px solid #1D2B53; box-shadow: 0 6px 0 #1D2B53; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #1D2B53; font-family: 'Nunito', sans-serif">
            <svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true" fill="none" stroke="#1D2B53" stroke-width="3" stroke-linecap="round"><circle cx="20" cy="20" r="17" fill="#FFFFFF"></circle><circle cx="14" cy="16" r="2.2" fill="#1D2B53" stroke="none"></circle><circle cx="26" cy="16" r="2.2" fill="#1D2B53" stroke="none"></circle><path d="M13 26 L27 26"></path></svg>
            <span style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 21px; line-height: 1">Medium</span>
            <span style="font-weight: 800; font-size: 13px; line-height: 1">Almost</span>
          </button>
          <button type="button" onClick="{{ rateHard }}" style="height: 100px; padding: 6px 4px; border-radius: 24px; background: #FF9C8F; border: 4px solid #1D2B53; box-shadow: 0 6px 0 #1D2B53; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #1D2B53; font-family: 'Nunito', sans-serif">
            <svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true" fill="none" stroke="#1D2B53" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="17" fill="#FFFFFF"></circle><circle cx="14" cy="16" r="2.2" fill="#1D2B53" stroke="none"></circle><circle cx="26" cy="16" r="2.2" fill="#1D2B53" stroke="none"></circle><path d="M12 28 Q16 23 20 27 Q24 31 28 26"></path></svg>
            <span style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 21px; line-height: 1">Hard</span>
            <span style="font-weight: 800; font-size: 13px; line-height: 1">Not yet</span>
          </button>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{ finished }}" hint-placeholder-val="{{ false }}">
    <div class="pop" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #FFFFFF; border: 5px solid #1D2B53; border-radius: 36px; box-shadow: 0 9px 0 #1D2B53; padding: 24px 20px; text-align: center">
      <svg viewBox="0 0 200 200" width="120" height="120" aria-hidden="true"><path d="M100 14 L124 70 L184 74 L138 112 L152 172 L100 140 L48 172 L62 112 L16 74 L76 70 Z" fill="#FFCE3A" stroke="#1D2B53" stroke-width="7" stroke-linejoin="round"></path><circle cx="84" cy="96" r="8" fill="#1D2B53"></circle><circle cx="116" cy="96" r="8" fill="#1D2B53"></circle><path d="M82 112 Q100 136 118 112" fill="#FF7A6B" stroke="#1D2B53" stroke-width="6" stroke-linejoin="round"></path></svg>
      <h2 style="margin: 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 40px; line-height: 1">All cards done!</h2>
      <div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; border-radius: 20px; background: #7ED957; border: 3px solid #1D2B53">
          <span style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 34px; line-height: 1">{{ counts.easy }}</span>
          <span style="font-weight: 800; font-size: 15px">Easy</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; border-radius: 20px; background: #FFCE3A; border: 3px solid #1D2B53">
          <span style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 34px; line-height: 1">{{ counts.medium }}</span>
          <span style="font-weight: 800; font-size: 15px">Medium</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; border-radius: 20px; background: #FF9C8F; border: 3px solid #1D2B53">
          <span style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 34px; line-height: 1">{{ counts.hard }}</span>
          <span style="font-weight: 800; font-size: 15px">Hard</span>
        </div>
      </div>
      <sc-if value="{{ hasTricky }}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{ reviewTricky }}" style="width: 100%; min-height: 64px; margin-top: 4px; border-radius: 999px; background: #FFCE3A; border: 4px solid #1D2B53; box-shadow: 0 6px 0 #1D2B53; cursor: pointer; color: #1D2B53; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 22px">{{ trickyLabel }}</button>
      </sc-if>
      <button type="button" onClick="{{ restart }}" style="width: 100%; min-height: 60px; border-radius: 999px; background: #FFFFFF; border: 4px solid #1D2B53; box-shadow: 0 5px 0 #1D2B53; cursor: pointer; color: #1D2B53; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 21px">Start again</button>
      <a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px; font-weight: 800; font-size: 17px">Go home</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startFlipped":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.cards = [
      { k: 'apple', word: 'apple', letter: 'Aa', sentence: 'I eat a red apple.', bg: '#FF9C8F' },
      { k: 'cat', word: 'cat', letter: 'Cc', sentence: 'The cat says meow.', bg: '#FFC48A' },
      { k: 'sun', word: 'sun', letter: 'Ss', sentence: 'The sun is hot.', bg: '#9FD8FF' },
      { k: 'fish', word: 'fish', letter: 'Ff', sentence: 'A fish can swim.', bg: '#B7A6FF' },
      { k: 'ball', word: 'ball', letter: 'Bb', sentence: 'I kick the ball.', bg: '#7ED957' },
      { k: 'tree', word: 'tree', letter: 'Tt', sentence: 'The tree is tall.', bg: '#FFCE3A' }
    ];
    this.state = {
      deck: this.cards.map((_, j) => j),
      p: 0,
      flipped: !!props.startFlipped,
      instant: true,   // true = jump to a face with no turn (new card), false = animate the flip
      deal: 0,
      ratings: {},
      finished: false
    };
  }
  componentDidUpdate(prev) {
    if (prev.startFlipped !== this.props.startFlipped) this.setState({ flipped: !!this.props.startFlipped, instant: true });
  }
  speak(text) {
    try {
      const s = window.speechSynthesis;
      if (!s) return;
      s.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.8;
      s.speak(u);
    } catch (e) {}
  }
  // Moving to another card: show its front instantly (no turn, so the answer is never revealed) and slide it in.
  go(step) {
    const n = this.state.deck.length;
    this.setState({ p: (this.state.p + step + n) % n, flipped: false, instant: true, deal: this.state.deal + 1 });
  }
  // Easy = I remember it now, Medium = I barely remember, Hard = I can't remember.
  rate(level) {
    const st = this.state;
    const card = this.cards[st.deck[st.p]];
    const ratings = Object.assign({}, st.ratings);
    ratings[card.k] = level;
    this.speak(level === 'easy' ? 'Super!' : (level === 'medium' ? 'Good try!' : 'We will practice it again.'));
    if (st.p >= st.deck.length - 1) this.setState({ ratings, finished: true, flipped: false, instant: true });
    else this.setState({ ratings, p: st.p + 1, flipped: false, instant: true, deal: st.deal + 1 });
  }
  renderVals() {
    const st = this.state;
    const { p, flipped, deck } = st;
    const card = this.cards[deck[Math.min(p, deck.length - 1)]];
    const pic = {};
    this.cards.forEach((c) => { pic[c.k] = c.k === card.k; });
    const counts = { easy: 0, medium: 0, hard: 0 };
    Object.keys(st.ratings).forEach((k) => { counts[st.ratings[k]] += 1; });
    const tricky = this.cards.map((c, j) => j).filter((j) => {
      const r = st.ratings[this.cards[j].k];
      return r === 'medium' || r === 'hard';
    });
    const restartAll = { deck: this.cards.map((_, j) => j), p: 0, flipped: false, instant: true, finished: false, ratings: {}, deal: st.deal + 1 };
    return {
      card,
      pic,
      counts,
      studying: !st.finished,
      finished: st.finished,
      front: !flipped,
      back: flipped,
      frontHidden: flipped ? 'true' : 'false',
      backHidden: flipped ? 'false' : 'true',
      cardBg: card.bg,
      turn: flipped ? 'rotateY(180deg)' : 'rotateY(0deg)',
      turnTransition: st.instant ? 'none' : 'transform 0.55s cubic-bezier(0.3, 0.7, 0.3, 1)',
      dealClass: st.deal === 0 ? '' : (st.deal % 2 ? 'dealA' : 'dealB'),
      cardLabel: flipped ? 'Word: ' + card.word + '. ' + card.sentence + ' Tap to see the picture' : 'Picture card. Tap to see the word',
      counter: st.finished ? 'Done' : (p + 1) + ' / ' + deck.length,
      dots: deck.map((_, j) => ({ w: !st.finished && j === p ? '34px' : '14px', bg: (st.finished || j <= p) ? '#6A45E8' : '#FFFFFF' })),
      hasTricky: tricky.length > 0,
      trickyLabel: 'Practice tricky words (' + tricky.length + ')',
      flip: () => { this.setState({ flipped: !flipped, instant: false }); if (!flipped) this.speak(card.word); },
      listen: () => this.speak(flipped ? card.word + '. ' + card.sentence : card.word),
      prev: () => this.go(-1),
      next: () => this.go(1),
      rateEasy: () => this.rate('easy'),
      rateMedium: () => this.rate('medium'),
      rateHard: () => this.rate('hard'),
      reviewTricky: () => this.setState(Object.assign({}, restartAll, { deck: tricky })),
      restart: () => this.setState(restartAll)
    };
  }
}
</script>
