<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Word Buddies – Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#1D2B53}
a{color:#1D2B53}a:hover{color:#3A4C80}
a:focus-visible,button:focus-visible{outline:4px solid #6A45E8;outline-offset:3px}
@keyframes drop{0%{transform:translateY(-8px) scale(.97);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
.drop{animation:drop .18s ease-out}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #D9F1FF; display: flex; flex-direction: column; gap: 20px; padding: 28px 22px 26px; font-family: 'Nunito', system-ui, sans-serif; color: #1D2B53; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px">
    <div style="flex-grow: 1; min-width: 0; position: relative; z-index: 30">
      <dc-import name="UserMenu" user-name="[NAME]" email="[EMAIL]" greeting="Good morning!" open="{{ menuOpen }}" sign-out-href="Main.dc.html" hint-size="100%,66px"></dc-import>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 8px 14px; background: #FFFFFF; border: 3px solid #1D2B53; border-radius: 999px; font-weight: 800; font-size: 19px; flex-shrink: 0">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2 L14.9 8.6 L22 9.2 L16.6 13.8 L18.2 21 L12 17.2 L5.8 21 L7.4 13.8 L2 9.2 L9.1 8.6 Z" fill="#FFCE3A" stroke="#1D2B53" stroke-width="2" stroke-linejoin="round"></path></svg>
      <span>12</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 4px 0 0">
    <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
      <h1 style="margin: 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 34px; line-height: 1.02">Let’s learn English!</h1>
      <p style="margin: 0; font-size: 18px; font-weight: 700">What do you want to play today?</p>
    </div>
    <svg viewBox="0 0 200 200" width="92" height="92" aria-hidden="true" style="flex-shrink: 0">
      <path d="M100 14 L124 70 L184 74 L138 112 L152 172 L100 140 L48 172 L62 112 L16 74 L76 70 Z" fill="#FFCE3A" stroke="#1D2B53" stroke-width="8" stroke-linejoin="round"></path>
      <circle cx="84" cy="96" r="8" fill="#1D2B53"></circle>
      <circle cx="116" cy="96" r="8" fill="#1D2B53"></circle>
      <path d="M86 116 Q100 130 114 116" fill="none" stroke="#1D2B53" stroke-width="7" stroke-linecap="round"></path>
      <circle cx="70" cy="114" r="7" fill="#FF7A6B" opacity="0.7"></circle>
      <circle cx="130" cy="114" r="7" fill="#FF7A6B" opacity="0.7"></circle>
    </svg>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
    <a href="FlashCard.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 18px 16px 20px; min-height: 210px; box-sizing: border-box; background: #FF9C8F; border: 4px solid #1D2B53; border-radius: 28px; box-shadow: 0 7px 0 #1D2B53; text-decoration: none; color: #1D2B53">
      <svg viewBox="0 0 80 80" width="72" height="72" aria-hidden="true">
        <rect x="10" y="18" width="40" height="52" rx="8" fill="#FFFFFF" stroke="#1D2B53" stroke-width="4" transform="rotate(-12 30 44)"></rect>
        <rect x="28" y="10" width="40" height="52" rx="8" fill="#FFCE3A" stroke="#1D2B53" stroke-width="4" transform="rotate(8 48 36)"></rect>
        <text x="48" y="45" text-anchor="middle" font-family="Baloo 2, Nunito, sans-serif" font-weight="800" font-size="22" fill="#1D2B53" transform="rotate(8 48 36)">Aa</text>
      </svg>
      <span style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 26px; line-height: 1">Flash Cards</span>
      <span style="font-weight: 700; font-size: 16px">Look, flip and say</span>
    </a>
    <a href="Practice.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 18px 16px 20px; min-height: 210px; box-sizing: border-box; background: #7ED957; border: 4px solid #1D2B53; border-radius: 28px; box-shadow: 0 7px 0 #1D2B53; text-decoration: none; color: #1D2B53">
      <svg viewBox="0 0 80 80" width="72" height="72" aria-hidden="true">
        <circle cx="40" cy="40" r="30" fill="#FFFFFF" stroke="#1D2B53" stroke-width="4"></circle>
        <circle cx="40" cy="40" r="19" fill="#FF7A6B" stroke="#1D2B53" stroke-width="4"></circle>
        <circle cx="40" cy="40" r="8" fill="#FFFFFF" stroke="#1D2B53" stroke-width="4"></circle>
      </svg>
      <span style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 26px; line-height: 1">Practice</span>
      <span style="font-weight: 700; font-size: 16px">Play word games</span>
    </a>
  </div>

  <div style="background: #FFFFFF; border: 4px solid #1D2B53; border-radius: 24px; padding: 14px 18px; display: flex; align-items: center; gap: 14px">
    <div aria-hidden="true" style="width: 64px; height: 64px; border-radius: 18px; background: #FFF1C2; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg viewBox="0 0 120 120" width="54" height="54">
        <path d="M60 38 C45 28 22 34 22 60 C22 86 42 104 60 98 C78 104 98 86 98 60 C98 34 75 28 60 38 Z" fill="#FF5A4E" stroke="#1D2B53" stroke-width="5" stroke-linejoin="round"></path>
        <path d="M60 38 L62 20" stroke="#1D2B53" stroke-width="5" stroke-linecap="round" fill="none"></path>
        <path d="M63 26 C70 14 84 14 88 18 C82 28 72 30 63 26 Z" fill="#7ED957" stroke="#1D2B53" stroke-width="5" stroke-linejoin="round"></path>
      </svg>
    </div>
    <div style="display: flex; flex-direction: column; flex-grow: 1">
      <span style="font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: #6A45E8">Word of the day</span>
      <span style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 28px; font-weight: 800; line-height: 1.1">apple</span>
    </div>
    <button type="button" aria-label="Listen to the word apple" onClick="{{ sayWord }}" style="width: 52px; height: 52px; border-radius: 50%; border: 3px solid #1D2B53; background: #6A45E8; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" fill="#FFFFFF"></path><path d="M16.5 8.5 C18 10 18 14 16.5 15.5"></path><path d="M19 6 C22 9 22 15 19 18"></path></svg>
    </button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"menuOpen":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  speak(text) {
    try {
      const s = window.speechSynthesis;
      if (!s) return;
      s.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.8;
      s.speak(u);
    } catch (e) {}
  }
  renderVals() {
    return {
      menuOpen: !!this.props.menuOpen,
      sayWord: () => this.speak('apple')
    };
  }
}
</script>
</body>
</html>
