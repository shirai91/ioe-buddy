<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Word picture</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{ box }}; height: {{ box }}; display: flex; align-items: center; justify-content: center">
  <sc-if value="{{ is.apple }}" hint-placeholder-val="{{ true }}">
    <svg viewBox="0 0 120 120" width="100%" height="100%" aria-hidden="true"><path d="M60 38 C45 28 22 34 22 60 C22 86 42 104 60 98 C78 104 98 86 98 60 C98 34 75 28 60 38 Z" fill="#FF5A4E" stroke="#1D2B53" stroke-width="4" stroke-linejoin="round"></path><path d="M60 38 L62 20" stroke="#1D2B53" stroke-width="4" stroke-linecap="round" fill="none"></path><path d="M63 26 C70 14 84 14 88 18 C82 28 72 30 63 26 Z" fill="#7ED957" stroke="#1D2B53" stroke-width="4" stroke-linejoin="round"></path><ellipse cx="42" cy="56" rx="6" ry="10" fill="#FFFFFF" opacity="0.6"></ellipse></svg>
  </sc-if>
  <sc-if value="{{ is.cat }}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 120 120" width="100%" height="100%" aria-hidden="true"><path d="M28 50 L32 20 L52 38 L68 38 L88 20 L92 50 C98 80 82 100 60 100 C38 100 22 80 28 50 Z" fill="#FFA94D" stroke="#1D2B53" stroke-width="4" stroke-linejoin="round"></path><circle cx="47" cy="62" r="5" fill="#1D2B53"></circle><circle cx="73" cy="62" r="5" fill="#1D2B53"></circle><path d="M55 73 L65 73 L60 79 Z" fill="#FF7A9C" stroke="#1D2B53" stroke-width="3" stroke-linejoin="round"></path><path d="M60 79 Q55 87 49 82 M60 79 Q65 87 71 82 M40 76 L18 72 M40 81 L18 86 M80 76 L102 72 M80 81 L102 86" fill="none" stroke="#1D2B53" stroke-width="3" stroke-linecap="round"></path></svg>
  </sc-if>
  <sc-if value="{{ is.sun }}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 120 120" width="100%" height="100%" aria-hidden="true"><path d="M60 26 L60 12 M60 94 L60 108 M26 60 L12 60 M94 60 L108 60 M84 36 L94 26 M36 36 L26 26 M84 84 L94 94 M36 84 L26 94" stroke="#1D2B53" stroke-width="5" stroke-linecap="round"></path><circle cx="60" cy="60" r="25" fill="#FFCE3A" stroke="#1D2B53" stroke-width="4"></circle><circle cx="52" cy="56" r="3.5" fill="#1D2B53"></circle><circle cx="68" cy="56" r="3.5" fill="#1D2B53"></circle><path d="M50 66 Q60 76 70 66" fill="none" stroke="#1D2B53" stroke-width="3.5" stroke-linecap="round"></path></svg>
  </sc-if>
  <sc-if value="{{ is.fish }}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 120 120" width="100%" height="100%" aria-hidden="true"><path d="M80 60 L106 40 L106 80 Z" fill="#4DABF7" stroke="#1D2B53" stroke-width="4" stroke-linejoin="round"></path><path d="M46 40 Q58 26 70 41" fill="#FFCE3A" stroke="#1D2B53" stroke-width="4" stroke-linejoin="round"></path><ellipse cx="54" cy="60" rx="32" ry="22" fill="#4DABF7" stroke="#1D2B53" stroke-width="4"></ellipse><circle cx="38" cy="55" r="6" fill="#FFFFFF" stroke="#1D2B53" stroke-width="3"></circle><circle cx="38" cy="55" r="2.5" fill="#1D2B53"></circle><path d="M28 67 Q33 72 38 67 M60 48 Q66 60 60 72" fill="none" stroke="#1D2B53" stroke-width="3" stroke-linecap="round"></path></svg>
  </sc-if>
  <sc-if value="{{ is.ball }}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 120 120" width="100%" height="100%" aria-hidden="true"><circle cx="60" cy="60" r="38" fill="#FF7A6B" stroke="#1D2B53" stroke-width="4"></circle><path d="M60 22 Q38 60 60 98" fill="#FFCE3A" stroke="#1D2B53" stroke-width="4"></path><path d="M60 22 Q82 60 60 98" fill="#FFFFFF" stroke="#1D2B53" stroke-width="4"></path><path d="M60 22 Q38 60 60 98 Q82 60 60 22" fill="none" stroke="#1D2B53" stroke-width="4"></path></svg>
  </sc-if>
  <sc-if value="{{ is.tree }}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 120 120" width="100%" height="100%" aria-hidden="true"><rect x="52" y="66" width="16" height="40" rx="3" fill="#B5651D" stroke="#1D2B53" stroke-width="4"></rect><path d="M36 76 C18 76 16 52 32 46 C30 26 52 18 62 28 C74 16 98 26 92 46 C106 54 100 78 84 76 Z" fill="#51CF66" stroke="#1D2B53" stroke-width="4" stroke-linejoin="round"></path><circle cx="46" cy="56" r="4" fill="#FF5A4E"></circle><circle cx="72" cy="44" r="4" fill="#FF5A4E"></circle><circle cx="80" cy="62" r="4" fill="#FF5A4E"></circle></svg>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["apple","cat","sun","fish","ball","tree"],"default":"apple"},"size":{"editor":"int","min":24,"max":400,"default":160},"$preview":{"width":160,"height":160}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind ?? 'apple';
    const size = Number(this.props.size ?? 160) || 160;
    const is = {};
    ['apple', 'cat', 'sun', 'fish', 'ball', 'tree'].forEach((k) => { is[k] = k === kind; });
    return { is, box: size + 'px' };
  }
}
</script>
</body>
</html>
